[project]
name = "clickathon-agenthouse"
version = "0.1.0"
description = "Click-a-thon 2026 Atlys AgentHouse — FastAPI + Agno agents on ClickHouse + Postgres"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agno[openai,psycopg,sql]>=2.0",
    "clickhouse-connect>=0.8",
    "fastapi>=0.115",
    "httpx>=0.28",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "sqlglot>=26.0",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
