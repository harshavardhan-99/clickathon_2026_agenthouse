version: 1.3.13

cache: true

interface:
  runCode: true

endpoints:
  custom:
    - name: "Ollama"
      apiKey: "ollama"
      baseURL: "http://host.docker.internal:11434/v1/"
      models:
        default:
          - "llama3.1:8b"
        fetch: true
      titleConvo: true
      titleModel: "current_model"
      summarize: false
      summaryModel: "current_model"
      modelDisplayLabel: "Ollama"
    - name: "Visualization Agent"
      apiKey: "not-needed"
      baseURL: "http://host.docker.internal:7780/v1"
      models:
        default:
          - "visualization-agent-legacy"
          - "visualization-agent"
        fetch: false
      titleConvo: true
      titleModel: "visualization-agent-legacy"
      # Stream so Reasoning panel gets live step progress
      forcePrompt: false
      modelDisplayLabel: "Visualization Agent"
      customParams:
        reasoningKey: reasoning_content
  agents:
    capabilities:
      - execute_code
      - file_search
      - tools

# Allow LibreChat (Docker) to reach MCP on the host
mcpSettings:
  allowedAddresses:
    - "host.docker.internal:8000"
    - "host.docker.internal:7780"

mcpServers:
  clickhouse:
    type: streamable-http
    url: http://host.docker.internal:8000/mcp
    timeout: 60000
    serverInstructions: true
